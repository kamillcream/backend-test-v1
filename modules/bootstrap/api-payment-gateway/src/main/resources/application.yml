spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080


test:
  pg:
    api-key: ${TEST_API_KEY}
    enc: ${TEST_ENC_VALUE}

kakaopay:
  secretKey: ${KAKAOPAY_SECRET_KEY}
  cid: ${KAKAOPAY_CLIENT_ID}


